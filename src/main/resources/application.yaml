server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: knowledge-management-service
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
      embedding: ${SPRING_AI_EMBEDDING_MODEL:none}
      image: ${SPRING_AI_IMAGE_MODEL:none}
    openai-sdk:
      api-key: ${OPENAI_API_KEY:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:knowledge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/supporthub}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 35000
        linger.ms: 20
        request.timeout.ms: 10000
        retry.backoff.ms: 1000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:knowledge-management-service}
      auto-offset-reset: earliest
      enable-auto-commit: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true

application:
  security:
    audience: ${JWT_AUDIENCE:knowledge-management-service}
  draft-generation:
    batch-size: ${DRAFT_GENERATION_BATCH_SIZE:20}
    poll-delay-ms: ${DRAFT_GENERATION_POLL_DELAY_MS:2000}
    lock-at-most-for: ${DRAFT_GENERATION_LOCK_AT_MOST_FOR:PT2M}
    lock-at-least-for: ${DRAFT_GENERATION_LOCK_AT_LEAST_FOR:PT0S}
  ai:
    article-generation:
      provider: ${ARTICLE_GENERATION_PROVIDER:openai}
      model: ${ARTICLE_GENERATION_MODEL:gpt-5.4-mini}
      max-output-tokens: ${ARTICLE_GENERATION_MAX_OUTPUT_TOKENS:2500}
      minimum-content-length: ${ARTICLE_GENERATION_MIN_CONTENT_LENGTH:120}
      maximum-content-length: ${ARTICLE_GENERATION_MAX_CONTENT_LENGTH:16000}
      insufficient-information-marker: ${ARTICLE_GENERATION_INSUFFICIENT_MARKER:INSUFFICIENT_INFORMATION}
      safe-logging-enabled: ${ARTICLE_GENERATION_SAFE_LOGGING_ENABLED:true}
      safe-guard-enabled: ${ARTICLE_GENERATION_SAFE_GUARD_ENABLED:false}
  integration-events:
    contracts:
      knowledge-article-proposed:
        event-type: ${EVENT_KNOWLEDGE_ARTICLE_PROPOSED:KnowledgeArticleProposed}
        version: ${EVENT_KNOWLEDGE_ARTICLE_PROPOSED_VERSION:1}
      ticket-message-added:
        event-type: ${EVENT_TICKET_MESSAGE_ADDED:TicketMessageAdded}
        version: ${EVENT_TICKET_MESSAGE_ADDED_VERSION:1}
      ticket-deleted:
        event-type: ${EVENT_TICKET_DELETED:TicketDeleted}
        version: ${EVENT_TICKET_DELETED_VERSION:1}
      organization-created:
        event-type: ${EVENT_ORGANIZATION_CREATED:OrganizationCreated}
        version: ${EVENT_ORGANIZATION_CREATED_VERSION:1}
      organization-deleted:
        event-type: ${EVENT_ORGANIZATION_DELETED:OrganizationDeleted}
        version: ${EVENT_ORGANIZATION_DELETED_VERSION:1}
      user-invitation-accepted:
        event-type: ${EVENT_USER_INVITATION_ACCEPTED:UserInvitationAccepted}
        version: ${EVENT_USER_INVITATION_ACCEPTED_VERSION:1}
      user-role-updated:
        event-type: ${EVENT_USER_ROLE_UPDATED:UserRoleUpdated}
        version: ${EVENT_USER_ROLE_UPDATED_VERSION:1}
      user-removed-from-organization:
        event-type: ${EVENT_USER_REMOVED_FROM_ORGANIZATION:UserRemovedFromOrganization}
        version: ${EVENT_USER_REMOVED_FROM_ORGANIZATION_VERSION:1}
      knowledge-article-draft-saved:
        event-type: ${EVENT_KNOWLEDGE_ARTICLE_DRAFT_SAVED:KnowledgeArticleDraftSaved}
        version: ${EVENT_KNOWLEDGE_ARTICLE_DRAFT_SAVED_VERSION:1}
      knowledge-article-draft-save-failed:
        event-type: ${EVENT_KNOWLEDGE_ARTICLE_DRAFT_SAVE_FAILED:KnowledgeArticleDraftSaveFailed}
        version: ${EVENT_KNOWLEDGE_ARTICLE_DRAFT_SAVE_FAILED_VERSION:1}
      knowledge-article-published:
        # Wire name deviates from docs (KnowledgeArticlePublished): ticket-management consumes
        # "KnowledgeArticleApproved". Override via env to realign once ticket-management is fixed.
        event-type: ${EVENT_KNOWLEDGE_ARTICLE_PUBLISHED:KnowledgeArticleApproved}
        version: ${EVENT_KNOWLEDGE_ARTICLE_PUBLISHED_VERSION:1}
      knowledge-article-rejected:
        event-type: ${EVENT_KNOWLEDGE_ARTICLE_REJECTED:KnowledgeArticleRejected}
        version: ${EVENT_KNOWLEDGE_ARTICLE_REJECTED_VERSION:1}
  kafka:
    consumer:
      ticket-management-events: ${KAFKA_TOPIC_TICKET_MANAGEMENT_EVENTS:ticket-management-events}
      organization-access-events: ${KAFKA_TOPIC_ORGANIZATION_ACCESS_EVENTS:organization-access-events}
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    producer:
      knowledge-management-events: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS:knowledge-management-events}
    dlt:
      name: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_DLT:knowledge-management-events-dlt}
      backoff-ms: ${KAFKA_DLT_BACKOFF_MS:1000}
      max-attempts: ${KAFKA_DLT_MAX_ATTEMPTS:5}
    topics:
      defaults:
        partitions: ${KAFKA_TOPIC_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_REPLICAS:1}
        min-in-sync-replicas: ${KAFKA_TOPIC_MIN_ISR:1}
      owned:
        knowledge-management-events: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS:knowledge-management-events}
        knowledge-management-events-dlt: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_DLT:knowledge-management-events-dlt}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:2000}
    lock-at-most-for: ${OUTBOX_LOCK_AT_MOST_FOR:PT30S}
    lock-at-least-for: ${OUTBOX_LOCK_AT_LEAST_FOR:PT0S}
    batch-send-timeout: ${OUTBOX_BATCH_SEND_TIMEOUT:PT40S}
    retry-backoff: ${OUTBOX_RETRY_BACKOFF:PT1S}
    max-retry-backoff: ${OUTBOX_MAX_RETRY_BACKOFF:PT5M}
    stuck-timeout: ${OUTBOX_STUCK_TIMEOUT:PT2M}
    routing:
      knowledge:
        # Keyed by the wire eventType. KnowledgeArticleApproved is the published-article event
        # (see integration-events.contracts.knowledge-article-published, deviates from docs).
        event-topics:
          KnowledgeArticleDraftSaved: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS:knowledge-management-events}
          KnowledgeArticleDraftSaveFailed: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS:knowledge-management-events}
          KnowledgeArticleApproved: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS:knowledge-management-events}
          KnowledgeArticleRejected: ${KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS:knowledge-management-events}
