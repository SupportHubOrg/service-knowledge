apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-base-config
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "production"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_CONNECT_TIMEOUT: "30000"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_READ_TIMEOUT: "30000"
  #Infrastructure Routes
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap:9092"
  KAFKA_CONSUMER_GROUP: "knowledge-base-service"
  #Security / Keycloak (Routing to internal cluster DNS)
  JWT_ISSUER_URI: "http://keycloak.default.svc.cluster.local/realms/supporthub"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak.default.svc.cluster.local/realms/supporthub/protocol/openid-connect/certs"
  JWT_AUDIENCE: "knowledge-base-service"
  #Core Event Topics
  KAFKA_TOPIC_TICKET_MANAGEMENT_EVENTS: "ticket-management-events"
  KAFKA_TOPIC_ORGANIZATION_ACCESS_EVENTS: "organization-access-events"
  KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_EVENTS: "knowledge-base-events"
  KAFKA_TOPIC_KNOWLEDGE_MANAGEMENT_DLT: "knowledge-base-events-dlt"
  #Article Generation Defaults
  ARTICLE_GENERATION_PROVIDER: "openai"
  ARTICLE_GENERATION_MODEL: "gpt-5.4-mini"
  ARTICLE_GENERATION_MAX_OUTPUT_TOKENS: "2500"
  ARTICLE_GENERATION_MAX_CONTENT_LENGTH: "16000"
  ARTICLE_GENERATION_SAFE_LOGGING_ENABLED: "true"
  ARTICLE_GENERATION_SAFE_GUARD_ENABLED: "false"